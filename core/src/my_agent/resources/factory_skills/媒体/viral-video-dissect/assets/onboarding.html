<svg viewBox="0 0 680 940" width="680" role="img" xmlns="http://www.w3.org/2000/svg">

  <text x="340" y="50" text-anchor="middle" font-size="17" font-weight="500" fill="#E8E6F0">视频号爆款拆解与二创（专业版）</text>
  <text x="340" y="70" text-anchor="middle" font-size="11.5" fill="#9B99A8">拆解脚本 → 量化评分 → 人机共创 → 二创脚本 → 选题库沉淀 的闭环</text>
  <line x1="50" y1="86" x2="630" y2="86" stroke="#3A3844" stroke-width="0.5"/>

  <!-- 适用场景 -->
  <text x="50" y="110" font-size="12.5" font-weight="500" fill="#CECBF6">适用场景</text>
  <text x="50" y="128" font-size="11.5" fill="#B4B2A9">视频号链接 / 本地视频 / 粘贴逐字稿 → 学习爆款结构 → 批量产出同类可拍脚本</text>
  <text x="50" y="146" font-size="11.5" fill="#B4B2A9">竞品分析 · 选题库建设 · 爆款框架沉淀 · 发布后复盘优化</text>
  <line x1="50" y1="160" x2="630" y2="160" stroke="#333140" stroke-width="0.5"/>

  <!-- 3 种输入 -->
  <text x="50" y="184" font-size="12.5" font-weight="500" fill="#CECBF6">三种输入（按优先级降级）</text>
  <g transform="translate(40,196)">
    <rect width="186" height="56" rx="9" fill="#26215C" stroke="#534AB7" stroke-width="0.7"/>
    <text x="16" y="22" font-size="12.5" font-weight="500" fill="#E8E6F0">① 视频号链接</text>
    <text x="16" y="42" font-size="10.5" fill="#AFA9EC">闭环限制，常需补料</text>
  </g>
  <g transform="translate(247,196)">
    <rect width="186" height="56" rx="9" fill="#1A2820" stroke="#1D9E75" stroke-width="0.7"/>
    <text x="16" y="22" font-size="12.5" font-weight="500" fill="#E8E6F0">② 视频 / 音频文件</text>
    <text x="16" y="42" font-size="10.5" fill="#5DCAA5">抽帧+ASR 最准</text>
  </g>
  <g transform="translate(454,196)">
    <rect width="186" height="56" rx="9" fill="#222830" stroke="#378ADD" stroke-width="0.7"/>
    <text x="16" y="22" font-size="12.5" font-weight="500" fill="#E8E6F0">③ 粘贴逐字稿</text>
    <text x="16" y="42" font-size="10.5" fill="#85B7EB">最可靠，优先采用</text>
  </g>
  <line x1="50" y1="270" x2="630" y2="270" stroke="#333140" stroke-width="0.5"/>

  <!-- 7 步流程 -->
  <text x="50" y="294" font-size="12.5" font-weight="500" fill="#CECBF6">七步工作流</text>
  <g transform="translate(40,306)">
    <rect width="600" height="232" rx="10" fill="#1B1A20" stroke="#333140" stroke-width="0.5"/>
    <text x="18" y="26" font-size="11.5" fill="#B4B2A9">1 获取+校对逐字稿（ASR 必做语义校正）</text>
    <text x="18" y="50" font-size="11.5" fill="#B4B2A9">2 抽帧视觉分析（场景切分优先·屏幕文字优先=专名真相）</text>
    <text x="18" y="74" font-size="11.5" fill="#B4B2A9">3 拆拍摄脚本（真实画面版，标【实测帧】/【推测】）</text>
    <text x="18" y="98" font-size="11.5" fill="#B4B2A9">4 提炼钩子 / 核心观点 / 金句</text>
    <text x="18" y="122" font-size="11.5" fill="#B4B2A9">5 框架分析：8 维量化评分 + 阈值红线（&lt;3 必补强）</text>
    <text x="18" y="146" font-size="11.5" fill="#B4B2A9">5.5 二创方向草案 → 暂停等你确认（人机共创关卡）</text>
    <text x="18" y="170" font-size="11.5" fill="#B4B2A9">6 生成二创脚本（分镜+手法沿用+发布包装）</text>
    <text x="18" y="194" font-size="11.5" fill="#B4B2A9">7 选题库沉淀 → 工作台 · 8 发布后复盘反哺</text>
    <text x="18" y="218" font-size="10.5" fill="#6F6D78">每次报告必含「本次运行证据」节（输入/降级/依赖/置信度）</text>
  </g>
  <line x1="50" y1="556" x2="630" y2="556" stroke="#333140" stroke-width="0.5"/>

  <!-- 护城河 -->
  <text x="50" y="580" font-size="12.5" font-weight="500" fill="#CECBF6">核心能力（护城河，不动）</text>
  <text x="50" y="600" font-size="11" fill="#B4B2A9">抽帧视觉分析 · 8 维评分+红线 · 人机共创确认 · 形态自适应 A/B/C</text>
  <text x="50" y="618" font-size="11" fill="#B4B2A9">选题库+工作台 · 平台规则库(R10) · 二次发布检测(R9)</text>
  <line x1="50" y1="632" x2="630" y2="632" stroke="#333140" stroke-width="0.5"/>

  <!-- 30秒上手 -->
  <text x="50" y="656" font-size="12.5" font-weight="500" fill="#CECBF6">30 秒上手（三步）</text>
  <text x="50" y="678" font-size="11.5" fill="#B4B2A9">① 发一条视频 / 链接 / 逐字稿　　② 说"拆解这条"　　③ 看方向草案确认，拿脚本</text>
  <text x="50" y="700" font-size="11.5" fill="#B4B2A9">视频号链接抓不到？会坦诚告知并请你发文件或贴逐字稿，不编造。</text>
  <text x="50" y="722" font-size="11.5" fill="#B4B2A9">首次运行会联网下载语音模型，稍慢（几分钟），之后秒开。</text>
  <text x="50" y="744" font-size="11.5" fill="#B4B2A9">隐私：视频与逐字稿仅在本地处理，不上传第三方。</text>
  <line x1="50" y1="762" x2="630" y2="762" stroke="#333140" stroke-width="0.5"/>

  <!-- 底部版本 -->
  <text x="50" y="786" font-size="11" fill="#6F6D78">版本 v1.4 · 2026-08-03 · 发布就绪：用户简介 / 隐私声明 / 首次运行说明 / 3行摘要 / 30秒上手 / LICENSE + 示例</text>
